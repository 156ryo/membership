<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3 ID3 Tag Editor</title>
    <script src="https://cdn.jsdelivr.net/npm/browser-id3-writer@4.4.0/dist/browser-id3-writer.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; color: #333; }
        .container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 550px; margin: 0 auto; }
        h2, h3 { margin-top: 0; }
        h3 { font-size: 1.2em; color: #1976d2; border-left: 4px solid #1976d2; padding-left: 8px; margin-bottom: 15px; }
        .status-bar { padding: 12px; margin-bottom: 20px; border-radius: 4px; background: #ffebee; color: #c62828; font-weight: bold; text-align: center; }
        .status-bar.active { background: #e8f5e9; color: #2e7d32; }
        .section-block { background: #f9f9f9; padding: 15px; border-radius: 6px; border: 1px solid #e0e0e0; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9em; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 1em; }
        button { background-color: #1976d2; color: white; border: none; padding: 12px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 1em; font-weight: bold; margin-bottom: 10px; transition: background-color 0.2s; }
        button:hover { background-color: #1565c0; }
        button:disabled { background-color: #b0bec5; cursor: not-allowed; }
        .btn-success { background-color: #2e7d32; }
        .btn-success:hover { background-color: #1b5e20; }
        .preview { margin-top: 10px; text-align: center; }
        canvas { border: 1px solid #ddd; border-radius: 4px; background: #eee; }
        .note { font-size: 0.8em; color: #666; margin-top: 5px; }
        .checkbox-label { font-weight: normal; font-size: 0.9em; display: inline-block; margin-left: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>MP3 タグエディター</h2>
    
    <div id="sdStatus" class="status-bar">SDカード: 未接続 (フォルダを開いてください)</div>
    <button id="openFolderBtn">📁 対象のフォルダ（SDカード等）を開く</button>

    <!-- 1. 一括設定セクション -->
    <div id="bulkSection" class="section-block" style="display: none;">
        <h3>1. アルバム共通設定（一括反映）</h3>
        <p class="note">フォルダ内のすべてのMP3ファイルに共通で適用されます。</p>
        
        <div class="form-group">
            <label for="bulkAlbum">共通アルバム名</label>
            <input type="text" id="bulkAlbum" maxlength="20" placeholder="最大20文字まで">
        </div>

        <div class="form-group">
            <label for="bulkArtist">共通アーティスト名</label>
            <input type="text" id="bulkArtist" placeholder="アーティスト名を入力">
        </div>

        <div class="form-group">
            <label for="bulkCoverArt">共通ジャケット画像</label>
            <input type="file" id="bulkCoverArt" accept="image/*">
            <div class="preview">
                <canvas id="bulkCanvas" width="120" height="120" style="display:none;"></canvas>
            </div>
        </div>

        <button id="bulkWriteBtn" class="btn-success">⚡ 共通設定を全ファイルに一括書き込み</button>
    </div>

    <!-- 2. 個別編集セクション -->
    <div id="editorSection" class="section-block" style="display: none;">
        <h3>2. 個別楽曲設定</h3>
        
        <div class="form-group">
            <label for="fileSelect">編集するMP3ファイル</label>
            <select id="fileSelect"></select>
        </div>

        <div class="form-group">
            <label for="title">曲名（タイトル）</label>
            <input type="text" id="title" placeholder="曲名を入力してください">
            <div style="margin-top: 8px;">
                <input type="checkbox" id="renameFile" checked>
                <label for="renameFile" class="checkbox-label">実際のファイル名も「曲名.mp3」に変更する</label>
            </div>
        </div>

        <div class="form-group">
            <label for="album">アルバム名</label>
            <input type="text" id="album" maxlength="20">
        </div>

        <div class="form-group">
            <label for="artist">アーティスト名</label>
            <input type="text" id="artist">
        </div>

        <div class="form-group">
            <label for="trackNum">トラック番号</label>
            <input type="number" id="trackNum" min="1">
        </div>

        <div class="form-group">
            <label for="coverArt">ジャケット画像</label>
            <input type="file" id="coverArt" accept="image/*">
            <div class="preview">
                <canvas id="imageCanvas" width="120" height="120" style="display:none;"></canvas>
            </div>
        </div>

        <button id="writeBtn" disabled>💾 このファイルのタグを書き込む</button>
    </div>
</div>

<script>
    const openFolderBtn = document.getElementById('openFolderBtn');
    const sdStatus = document.getElementById('sdStatus');
    const bulkSection = document.getElementById('bulkSection');
    const editorSection = document.getElementById('editorSection');
    const fileSelect = document.getElementById('fileSelect');
    const writeBtn = document.getElementById('writeBtn');
    const bulkWriteBtn = document.getElementById('bulkWriteBtn');
    
    const coverArtInput = document.getElementById('coverArt');
    const imageCanvas = document.getElementById('imageCanvas');
    const ctx = imageCanvas.getContext('2d');

    const bulkCoverArtInput = document.getElementById('bulkCoverArt');
    const bulkCanvas = document.getElementById('bulkCanvas');
    const bulkCtx = bulkCanvas.getContext('2d');

    let directoryHandle = null;
    let mp3FileNames = []; // フォルダ内のMP3ファイル名リスト
    let coverArtBuffer = null;
    let bulkCoverArtBuffer = null;

    openFolderBtn.addEventListener('click', async () => {
        try {
            directoryHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
            sdStatus.textContent = `接続済: ${directoryHandle.name}`;
            sdStatus.classList.add('active');
            
            bulkSection.style.display = 'block';
            editorSection.style.display = 'block';
            
            await loadMp3Files();
        } catch (error) {
            console.error('フォルダ選択エラー:', error);
        }
    });

    // フォルダ内のMP3をリストアップして配列とセレクトボックスに格納
    async function loadMp3Files(fileToSelect = null) {
        fileSelect.innerHTML = '';
        mp3FileNames = [];
        let hasFiles = false;

        for await (const entry of directoryHandle.values()) {
            if (entry.kind === 'file' && entry.name.toLowerCase().endsWith('.mp3')) {
                mp3FileNames.push(entry.name);
                
                const option = document.createElement('option');
                option.value = entry.name;
                option.textContent = entry.name;
                fileSelect.appendChild(option);
                hasFiles = true;
            }
        }

        if (hasFiles) {
            writeBtn.disabled = false;
            bulkWriteBtn.disabled = false;
            if (fileToSelect) {
                fileSelect.value = fileToSelect;
            }
            await loadSelectedTags();
        } else {
            const option = document.createElement('option');
            option.textContent = "MP3ファイルが見つかりません";
            fileSelect.appendChild(option);
            writeBtn.disabled = true;
            bulkWriteBtn.disabled = true;
        }
    }

    fileSelect.addEventListener('change', loadSelectedTags);

    // jsmediatagsをPromise化（一括処理で安全に非同期ループさせるため）
    function readTagsPromise(file) {
        return new Promise((resolve) => {
            jsmediatags.read(file, {
                onSuccess: function(tag) { resolve(tag.tags); },
                onError: function(error) { resolve({}); }
            });
        });
    }

    // 選択されたファイルのID3タグを読み込んでフォームにセット
    async function loadSelectedTags() {
        const selectedFileName = fileSelect.value;
        if (!selectedFileName) return;

        // リセット
        document.getElementById('title').value = '';
        document.getElementById('album').value = '';
        document.getElementById('artist').value = '';
        document.getElementById('trackNum').value = '';
        coverArtInput.value = '';
        ctx.clearRect(0, 0, 120, 120);
        imageCanvas.style.display = 'none';
        coverArtBuffer = null;

        try {
            const fileHandle = await directoryHandle.getFileHandle(selectedFileName);
            const file = await fileHandle.getFile();
            const tags = await readTagsPromise(file);

            if (tags.title) document.getElementById('title').value = tags.title;
            if (tags.album) document.getElementById('album').value = tags.album.substring(0, 20);
            if (tags.artist) document.getElementById('artist').value = tags.artist;
            if (tags.track) document.getElementById('trackNum').value = tags.track;

            if (tags.picture) {
                const data = tags.picture.data;
                const format = tags.picture.format;
                const byteArray = new Uint8Array(data);
                const blob = new Blob([byteArray], { type: format });
                const imageUrl = URL.createObjectURL(blob);

                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0, 0, 120, 120);
                    ctx.drawImage(img, 0, 0, 120, 120);
                    imageCanvas.style.display = 'inline-block';
                    
                    imageCanvas.toBlob(async (newBlob) => {
                        coverArtBuffer = await newBlob.arrayBuffer();
                    }, 'image/jpeg', 0.9);
                    URL.revokeObjectURL(imageUrl);
                };
                img.src = imageUrl;
            }
        } catch (error) {
            console.error("ファイルの読み込みに失敗しました", error);
        }
    }

    // 画像の共通リサイズ処理
    function handleImageInput(inputElement, canvasElement, context, callback) {
        const file = inputElement.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                context.clearRect(0, 0, 120, 120);
                context.drawImage(img, 0, 0, 120, 120);
                canvasElement.style.display = 'inline-block';
                
                canvasElement.toBlob(async (blob) => {
                    callback(await blob.arrayBuffer());
                }, 'image/jpeg', 0.9);
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }

    coverArtInput.addEventListener('change', () => {
        handleImageInput(coverArtInput, imageCanvas, ctx, (buffer) => { coverArtBuffer = buffer; });
    });

    bulkCoverArtInput.addEventListener('change', () => {
        handleImageInput(bulkCoverArtInput, bulkCanvas, bulkCtx, (buffer) => { bulkCoverArtBuffer = buffer; });
    });

    // ★新規追加: 一括書き込み処理
    bulkWriteBtn.addEventListener('click', async () => {
        const bulkAlbum = document.getElementById('bulkAlbum').value.substring(0, 20);
        const bulkArtist = document.getElementById('bulkArtist').value;

        if (!bulkAlbum && !bulkArtist && !bulkCoverArtBuffer) {
            alert('一括反映する項目を少なくとも1つ入力・選択してください。');
            return;
        }

        if (!confirm('フォルダ内のすべてのMP3ファイルに共通設定を上書きします。よろしいですか？（既存の曲名やトラック番号は維持されます）')) {
            return;
        }

        try {
            bulkWriteBtn.disabled = true;
            let count = 0;

            for (const fileName of mp3FileNames) {
                count++;
                bulkWriteBtn.textContent = `⏳ 書き込み中... (${count} / ${mp3FileNames.length} 件)`;

                const fileHandle = await directoryHandle.getFileHandle(fileName);
                const file = await fileHandle.getFile();
                
                // 1. 既存のタグ（タイトルとトラック番号等）を退避するために読み込む
                const existingTags = await readTagsPromise(file);
                const currentTitle = existingTags.title || "";
                const currentTrack = existingTags.track || "";

                // 2. バイナリを読み込んでID3Writerに渡す
                const arrayBuffer = await file.arrayBuffer();
                const writer = new ID3Writer(arrayBuffer);

                // 既存タグの維持（上書きされないようにマージ）
                if (currentTitle) writer.setFrame('TIT2', currentTitle);
                if (currentTrack) writer.setFrame('TRCK', currentTrack);

                // 共通設定の上書き（入力がある場合のみ）
                if (bulkAlbum) writer.setFrame('TALB', bulkAlbum);
                if (bulkArtist) writer.setFrame('TPE1', [bulkArtist]);
                if (bulkCoverArtBuffer) {
                    writer.setFrame('APIC', {
                        type: 3,
                        data: bulkCoverArtBuffer,
                        description: 'Cover'
                    });
                }

                writer.addTag();
                
                // 3. ファイルへの書き込み
                const writable = await fileHandle.createWritable();
                await writable.write(writer.arrayBuffer);
                await writable.close();
            }

            alert('すべてのファイルへ共通設定の一括書き込みが完了しました！');
            // 現在選択されているファイルの表示を更新
            await loadSelectedTags();

        } catch (error) {
            console.error(error);
            alert('一括書き込み中にエラーが発生しました。');
        } finally {
            bulkWriteBtn.disabled = false;
            bulkWriteBtn.textContent = '⚡ 共通設定を全ファイルに一括書き込み';
        }
    });

    // 個別タグの書き込み処理
    writeBtn.addEventListener('click', async () => {
        try {
            writeBtn.disabled = true;
            writeBtn.textContent = '書き込み中...';

            const selectedFileName = fileSelect.value;
            const title = document.getElementById('title').value;
            const album = document.getElementById('album').value.substring(0, 20); 
            const artist = document.getElementById('artist').value;
            const trackNum = document.getElementById('trackNum').value;
            const renameFile = document.getElementById('renameFile').checked;

            const fileHandle = await directoryHandle.getFileHandle(selectedFileName);
            const file = await fileHandle.getFile();
            const arrayBuffer = await file.arrayBuffer();

            const writer = new ID3Writer(arrayBuffer);

            if (title) writer.setFrame('TIT2', title);
            if (album) writer.setFrame('TALB', album);
            if (artist) writer.setFrame('TPE1', [artist]);
            if (trackNum) writer.setFrame('TRCK', trackNum);
            
            if (coverArtBuffer) {
                writer.setFrame('APIC', {
                    type: 3,
                    data: coverArtBuffer,
                    description: 'Cover'
                });
            }

            writer.addTag();
            const taggedBuffer = writer.arrayBuffer;

            if (renameFile && title) {
                const safeTitle = title.replace(/[\\/:*?"<>|]/g, '_');
                const newFileName = `${safeTitle}.mp3`;

                if (newFileName !== selectedFileName) {
                    const newFileHandle = await directoryHandle.getFileHandle(newFileName, { create: true });
                    const writable = await newFileHandle.createWritable();
                    await writable.write(taggedBuffer);
                    await writable.close();

                    await directoryHandle.removeEntry(selectedFileName);
                    
                    alert(`タグを書き込み、ファイル名を「${newFileName}」に変更しました！`);
                    await loadMp3Files(newFileName); 
                    return; 
                }
            }

            const writable = await fileHandle.createWritable();
            await writable.write(taggedBuffer);
            await writable.close();

            alert(`${selectedFileName} にタグを書き込みました！`);
            await loadSelectedTags();

        } catch (error) {
            console.error(error);
            alert('書き込み中にエラーが発生しました。');
        } finally {
            writeBtn.disabled = false;
            writeBtn.textContent = '💾 このファイルのタグを書き込む';
        }
    });
</script>

</body>
</html>
