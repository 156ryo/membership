<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゲームフレンド申請フォーム</title>
    <style>
             /* ページ全体の余白をなくし、背景色などを設定 */
        body {
            margin: 0;
            font-family: sans-serif;
            line-height: 1.6;
        }           /* 一番上のヘッダー帯 */
        header {
            height: 20px; /* 高さを少し太くしました (5pxだと細すぎるため) */
            background-color: #051278; /* テーブルヘッダーと同じ色 */
        }

        .FormWhole{ max-width: 600px; font-family: sans-serif; line-height: 1.6; margin: 2em auto; padding: 0 1em;}
        h1 { text-align: center; }
        form { display: flex; flex-direction: column; gap: 1em; }
        label { font-weight: bold; }
        input { padding: 0.5em; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 0.7em; background-color: #051278; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; }
        button:hover { background-color: #2f05ff; }
        #message { margin-top: 1em; text-align: center; font-weight: bold; }
        .channel-button {
            display: inline-block;
            padding: 5px 15px;
            background-color: #ff0000; /* YouTubeの赤色 */
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        .channel-button:hover {
            background-color: #cc0000;
        }
    </style>
</head>
    <header></header>
<body>
    <header></header>

    <div class="FormWhole">
        <h1>ぷにぷにフレンド申請</h1>
            <p>フレンド枠には限りがあり、申請は先着順となります。<br>なお、毎月1日にリストが更新されます。</p>
            
            <p><b>お願い</b></p>
            
            <div style="display: flex; align-items: center; gap: 1em;">
                <p style="margin: 0;">申請する方はチャンネル登録をお願いいたします。</p><br>
                
            </div>
            <a href="https://www.youtube.com/@ryonixi" target="_blank" class="channel-button">チャンネル登録</a>
            <p><b>禁止事項</b></p>
            <p><font color="red">複数垢の登録(無許可時に限る)、卑猥な言葉の入力</font></p>
            <p>守れなかった場合はこちらで登録を削除します。</p>

            <form id="friend-form">
                <label for="game-username">ゲームのユーザー名</label>
                <input type="text" id="game-username" name="gameUsername" required>

                <label for="youtube-name">YouTubeのアカウント名</label>
                <input type="text" id="youtube-name" name="youtubeName" required>

                <label for="game-id">フレンドID</label>
                <input type="text" id="game-id" name="gameId" required>

                <button type="submit" id="submit-button">送信する</button>
            </form>
            
            <div id="message"></div>

            <hr>
            <p style="text-align:center;"><a href="https://156ryo.github.io/membership/friendlist.html">現在のフレンドリストを見る</a></p>
    </div>
    
    <script>
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbz7fkIli9cuT7imWYnb2MgBDIyEcgVZfEK3oq0PCOLC3fTIsXMtvYNBI2AyHLkTO0rx/exec';
        // 以下、JavaScript部分は変更なし
        const form = document.getElementById('friend-form');
        const messageDiv = document.getElementById('message');
        const submitButton = document.getElementById('submit-button');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            submitButton.disabled = true;
            submitButton.textContent = '送信中...';
            messageDiv.textContent = '';
            const formData = new FormData(form);
            
            fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                body: formData,
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    messageDiv.style.color = 'green';
                    messageDiv.textContent = '応募が完了しました！リストページをご確認ください。';
                    form.reset();
                } else {
                    throw new Error(data.message);
                }
            })
            .catch(error => {
                messageDiv.style.color = 'red';
                messageDiv.textContent = 'エラーが発生しました: ' + error.message;
            })
            .finally(() => {
                submitButton.disabled = false;
                submitButton.textContent = '送信する';
            });
        });
    </script>
</body>
</html>
