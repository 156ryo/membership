        body {

            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .result-stage {
            position: absolute;
            width: 600px;
            height: 1250px;
            
            left: 50%;
            top: -720px;
            transform: translate(-50%, 0);
            pointer-events: none;

        .ball {

            position: absolute;
            top: 20px; /* 落下開始位置を高く設定 */

.paper {
    width: 272px;

    border: 2px solid black;

    line-height: 1.6;
    font-size: 4rem;
    font-weight: bold;
    display: none;
    animation: open 1.2s ease-in-out forwards; /* 拡大アニメーション */
}

@keyframes drop {
    0% {
        top: -12px; /* 落下開始位置 */
    }
    100% {
        top: 20px; /* 落下終了位置 */
    }
}

@keyframes open {
    0% {
        transform: scale(0);
    }
    100% {
        transform: scale(1);
    }
}

<body>
    <div class="header" id="header">おみくじの挑戦者求む!</div>
    <div class="disc">1回 100円(スパチャ)</div>

    <div class="container">
        <div class="gacha-machine">
            <img src="./img2/ガチャリアルA.png" alt="ガチャ筐体" class="machine">
            <img src="./img2/つまみリアルA.png" alt="ツマミ" class="knob" id="knob">
        </div>
        <div class="result-stage" id="result-stage">
            <img src="" alt="ガチャ玉" class="ball" id="ball">
            <div class="paper" id="paper"></div>
        </div>
        <div class="name-input-container">
            <input type="text" id="name-input" style="width: 200px; height: 40px; font-size: 28px;" placeholder="名前を入力" />
            <button id="name-submit">OK</button>
        </div>
        <button id="start-button">回す</button>
        <button id="reset-button" class="reset-button">リセット</button>
    </div>
    <script>
        const fortunes = [
            { name: "神 吉", probability: 2, img: "./img2/神の玉.png" },
            { name: "極 吉", probability: 8, img: "./img2/金の玉.PNG" },
            { name: "大 吉", probability: 15, img: "./img2/銅玉.PNG" },
            { name: "中 吉", probability: 25, img: "./img2/赤玉.png" },
            { name: "小 吉", probability: 30, img: "./img2/青玉.png" },
            { name: "凶", probability: 20, img: "./img2/外れ玉.png" }
        ];

        const luckyItems = [
            "四つ葉のクローバー",
            "金の鈴",
            "赤いリボン",
            "青い石",
            "木の葉",
            "光るペンダント",
            "ラッキーコイン",
            "幸運のカエル"
        ];

        let currentFortune = null;

        const header = document.getElementById("header");
        const nameInput = document.getElementById("name-input");
        const nameSubmit = document.getElementById("name-submit");
        const knob = document.getElementById("knob");
        const ball = document.getElementById("ball");
        const paper = document.getElementById("paper");
        const startButton = document.getElementById("start-button");
        const resetButton = document.getElementById("reset-button");
        const resultStage = document.getElementById("result-stage");

        nameSubmit.addEventListener("click", function () {
            const name = nameInput.value.trim();
            if (name) {
                header.textContent = `${name}さんの挑戦`;
            } else {
                header.textContent = "おみくじの挑戦者求む!";
            }
        });

        startButton.addEventListener("click", function () {
            currentFortune = drawFortune();
            const luckyItem = drawLuckyItem();
            ball.src = currentFortune.img;

            knob.style.transform = "rotate(180deg)";

            setTimeout(() => {
                ball.style.display = "block";

                setTimeout(() => {
                    paper.style.display = "block";
                    paper.style.animation = "open 2s ease-in-out forwards";

                    knob.style.transform = "rotate(0deg)";
                    paper.innerHTML = `
                        ${currentFortune.name}
                        <div class="lucky-item">ラッキーアイテム<br>${luckyItem}</div>
                    `;
                }, 1000);
            }, 500);
        });

        resetButton.addEventListener("click", function () {
            knob.style.transform = "rotate(0deg)";
            ball.style.display = "none";
            paper.style.display = "none";
            paper.style.animation = "";
            currentFortune = null;
        });

        function drawFortune() {
            const random = Math.random() * 100;
            let cumulativeProbability = 0;

            for (const fortune of fortunes) {
                cumulativeProbability += fortune.probability;
                if (random < cumulativeProbability) {
                    return fortune;
                }
            }
        }

        function drawLuckyItem() {
            const randomIndex = Math.floor(Math.random() * luckyItems.length);
            return luckyItems[randomIndex];
        }

        function updateResultStagePosition() {
            const gachaMachine = document.querySelector('.gacha-machine');
            const machineRect = gachaMachine.getBoundingClientRect();

            resultStage.style.top = `${machineRect.top + window.scrollY + machineRect.height / 2}px`;
            resultStage.style.left = `${machineRect.left + window.scrollX + machineRect.width / 2}px`;
        }

        window.addEventListener('resize', updateResultStagePosition);
        window.addEventListener('load', updateResultStagePosition);
    </script>
</body>
</html>
